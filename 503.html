<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="60">
  <title>503 - Wartungsarbeiten | Cinar Grill</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A1A1A;color:#fff;text-align:center;padding:20px}
    .maintenance-container{max-width:600px}
    .icon{font-size:4rem;margin-bottom:1.5rem}
    h1{font-size:clamp(2rem,6vw,3rem);margin-bottom:1rem;font-weight:700}
    p{font-size:1.125rem;margin-bottom:2rem;opacity:0.85;line-height:1.6}
    .spinner{width:50px;height:50px;margin:2rem auto;border:4px solid rgba(255,255,255,0.1);border-top-color:#C41E3A;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:rgba(255,255,255,0.3)}}
  </style>
</head>
<body>
  <div class="maintenance-container">
    <div class="icon" aria-hidden="true">🔧</div>
    <h1>Wartungsarbeiten</h1>
    <p>Wir führen gerade wichtige Wartungsarbeiten durch, um Ihnen ein besseres Erlebnis zu bieten. Bitte versuchen Sie es in wenigen Minuten erneut.</p>
    <div class="spinner" role="status" aria-label="Lädt"></div>
    <p style="font-size:0.95rem;opacity:0.7">Diese Seite lädt automatisch neu...</p>
  </div>
</body>
</html>
