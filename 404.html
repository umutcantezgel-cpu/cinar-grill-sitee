<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 - Seite nicht gefunden | Cinar Grill</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#C41E3A,#8B1429);color:#fff;text-align:center;padding:20px}
    .error-container{max-width:600px}
    h1{font-size:clamp(4rem,10vw,8rem);font-weight:900;margin-bottom:1rem;opacity:0.9}
    h2{font-size:clamp(1.5rem,4vw,2.5rem);margin-bottom:1.5rem;font-weight:400}
    p{font-size:1.125rem;margin-bottom:2rem;opacity:0.85;line-height:1.6}
    .btn{display:inline-block;padding:14px 32px;background:#fff;color:#C41E3A;text-decoration:none;border-radius:6px;font-weight:600;transition:transform 0.2s,box-shadow 0.2s;min-width:44px;min-height:44px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
    .btn:focus{outline:3px solid #fff;outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="error-container">
    <h1 aria-label="Error 404">404</h1>
    <h2>Seite nicht gefunden</h2>
    <p>Die von Ihnen gesuchte Seite existiert leider nicht. Möglicherweise wurde sie verschoben oder gelöscht.</p>
    <a href="/" class="btn">Zurück zur Startseite</a>
  </div>
</body>
</html>
